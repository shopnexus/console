<style>
  :root { --md-primary: #005049; --md-on-primary: #FFFFFF; --md-primary-container: #066A61; --md-on-primary-container: #97E7DB; --md-secondary: #47645F; --md-on-secondary: #FFFFFF; --md-secondary-container: #C7E6E0; --md-on-secondary-container: #4B6863; --md-tertiary: #773115; --md-on-tertiary: #FFFFFF; --md-tertiary-container: #95482A; --md-on-tertiary-container: #FFCDBC; --md-tertiary-fixed: #FFDBCF; --md-on-tertiary-fixed-variant: #773215; --md-error: #BA1A1A; --md-on-error: #FFFFFF; --md-error-container: #FFDAD6; --md-surface: #F7FAF8; --md-surface-container-lowest: #FFFFFF; --md-surface-container-low: #F1F4F2; --md-surface-container: #EBEFED; --md-surface-container-high: #E6E9E7; --md-surface-container-highest: #E0E3E1; --md-on-surface: #181C1C; --md-on-surface-variant: #3E4947; --md-outline: #6E7977; --md-outline-variant: #BEC9C6; --md-inverse-surface: #2D3130; --md-inverse-on-surface: #EEF1EF; --md-inverse-primary: #85D5C9;

    --effects: linear(0, 0.286, 0.625, 0.826, 0.924, 0.968, 0.987, 0.995, 1); }
  html, body { background: var(--md-surface); font-family: "Be Vietnam Pro", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .state { position: relative; isolation: isolate; }
  .state::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: currentColor; opacity: 0;
    pointer-events: none; transition: opacity 140ms var(--effects); }
  .state:hover::after { opacity: .08; }
  .state:active::after { opacity: .1; }
  @keyframes caret { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
  .caret { width: 2px; height: 28px; background: var(--md-primary); animation: caret 1.06s steps(1) infinite; }
  @keyframes drift { 0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)) } 50% { transform: translateY(-10px) rotate(calc(var(--r, 0deg) + 8deg)) } }
  .drift { animation: drift 9s var(--effects) infinite; }

  html, body { background: var(--md-surface-container); }
  body, body * { font-family: "Geist", system-ui, sans-serif; letter-spacing: -0.012em; }
  body .mono, body .mono * { font-variant-numeric: tabular-nums; }
  .tnum { font-variant-numeric: tabular-nums; }
  .tight { letter-spacing: -0.022em !important; }
  .hair { border-color: color-mix(in srgb, var(--md-outline-variant) 70%, white); }
  .lift { box-shadow: 0 1px 2px rgba(16, 24, 22, .06), 0 0 0 1px rgba(16, 24, 22, .06); }
  .hov:hover { background: var(--md-surface-container-low); }
  .band { background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--md-primary) 9%, transparent), transparent 60%),
    radial-gradient(80% 120% at 100% 0%, color-mix(in srgb, var(--md-tertiary-fixed) 45%, transparent), transparent 55%); }
  .band-error { background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--md-error) 10%, transparent), transparent 60%),
    radial-gradient(80% 120% at 100% 0%, color-mix(in srgb, var(--md-error-container) 70%, transparent), transparent 55%); }
  .dots { background-image: radial-gradient(circle, rgba(16,24,22,.07) 1px, transparent 1px); background-size: 16px 16px;
    mask-image: linear-gradient(to bottom, black, transparent); }

</style>
