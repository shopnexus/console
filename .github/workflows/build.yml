name: Build image

# A push to main builds the image once and tags it :main and :sha-<commit>.
# Argo CD Image Updater deploys :main to dev by digest. A vX.Y.Z tag builds
# nothing: it adds the tag X.Y.Z to the image already built for that commit,
# so prod runs the same digest dev ran.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the image built for this commit
        run: |
          version=${GITHUB_REF_NAME#v}
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not vX.Y.Z"
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          source="$IMAGE:sha-$commit"
          if ! docker buildx imagetools inspect "$source" >/dev/null; then
            echo "::error::$source does not exist. Push $commit to main and wait for its build, then tag it."
            exit 1
          fi
          docker buildx imagetools create --tag "$IMAGE:$version" "$source"
          echo "$IMAGE:$version is $(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest.Digest}}')"
